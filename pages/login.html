<!DOCTYPE html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      html, body {
        background: #060606;
        color: #f5f5f5;
        margin: 0;
      }
    </style>
    <title>Entrar | Barbearia Feitosa</title>
    <link rel="icon" type="image/jpeg" href="../assets/icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" /></noscript>
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
    <!-- dev-cache-bust: v=1 — aumenta este número sempre que precisares de forçar reload em dev -->
    <main class="page-shell">
      <section class="form-card">
        <div class="form-header">
          <p class="eyebrow">Bem-vindo de volta</p>
          <h1>Entrar</h1>
          <p>Insere os teus dados para acederes ao sistema.</p>
        </div>

        <form id="loginForm" novalidate>
          <label class="field">
            <span>Telefone</span>
            <div class="phone-input">
              <span class="prefix">+351</span>
              <input id="telefoneLogin" type="tel" inputmode="numeric" maxlength="9" placeholder="912345678" required />
            </div>
          </label>

          <label class="field">
            <span>Senha</span>
            <input id="senhaLogin" type="password" placeholder="••••••" required />
          </label>

          <div id="feedbackLogin" class="feedback" aria-live="polite"></div>

          <button class="btn btn-primary btn-block" type="submit">Entrar</button>
        </form>

        <p class="switch-link">
          Ainda não tens conta?
          <a href="registar.html">Regista-te</a>
        </p>
      </section>
    </main>

    <script type="module" src="../js/auth.js?v=1"></script>
  </body>
</html>
