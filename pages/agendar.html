<!DOCTYPE html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      html, body {
        background: #060606;
        color: #f5f5f5;
        margin: 0;
      }
    </style>
    <title>Fazer nova marcação | Barbearia Feitosa</title>
    <link rel="icon" type="image/jpeg" href="../assets/icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" /></noscript>
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
    <!-- dev-cache-bust: v=1 — aumenta este número sempre que precisares de forçar reload em dev -->
    <main class="page-shell">
      <section class="form-card">
        <p class="eyebrow">Agendar</p>
        <h1 id="agendarTitulo">Nova marcação</h1>
        <p>Preenche o formulário abaixo para criar a tua próxima marcação.</p>

        <form id="agendarForm" novalidate>
          <div class="field">
            <span>Serviço</span>
            <select id="servicoAgendar" required>
              <option value="">A carregar serviços...</option>
            </select>
          </div>

          <div class="grid-2">
            <label class="field">
              <span>Dia</span>
              <input id="dataAgendar" type="date" required />
            </label>
            <div class="field">
              <span>Hora</span>
              <select id="horaAgendar" required>
                <option value="">Escolhe uma hora</option>
              </select>
            </div>
          </div>

          <div id="feedbackAgendar" class="feedback" aria-live="polite"></div>
          <button id="agendarSubmitBtn" class="btn btn-primary btn-block btn-compact" type="submit">Confirmar marcação</button>
          <button id="cancelarMarcacaoBtn" class="btn btn-danger btn-block btn-compact hidden" type="button">Cancelar marcação</button>
          <a class="btn btn-secondary btn-block btn-compact" href="./home.html">Voltar</a>
        </form>
      </section>
    </main>
    <script type="module" src="../js/home.js?v=1"></script>
  </body>
</html>
