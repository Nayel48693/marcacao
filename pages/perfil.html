<!DOCTYPE html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      html, body {
        background: #060606;
        color: #f5f5f5;
        margin: 0;
      }
    </style>
    <title>Editar Perfil | Marcações Barber</title>
    <link rel="icon" type="image/jpeg" href="../assets/icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" /></noscript>
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
    <!-- dev-cache-bust: v=1 — aumenta este número sempre que precisares de forçar reload em dev -->
    <main class="page-shell">
      <section class="form-card">
        <p class="eyebrow">Perfil</p>
        <h1>Editar perfil</h1>
        <p>Atualiza o nome  e foto de perfil.</p>

        <form id="perfilForm" novalidate>
        <div class="field avatar-field">
  <span>Imagem de perfil</span>
  <label for="avatarFile" class="avatar-upload-circle">
    <div id="avatarPreview" class="avatar-preview-inner">
      <span class="chip-initials">?</span>
    </div>
    <span class="avatar-upload-hint">Alterar foto</span>
  </label>
  <input id="avatarFile" type="file" accept="image/*" class="visually-hidden" />
</div>

          <label class="field">
            <span>Nome</span>
            <input id="nomePerfilInput" type="text" placeholder="João Silva" required />
          </label>

          <div class="field">
            <span>Telefone</span>
            <p class="muted small">+351 <span id="telefonePerfilReadOnly">912345678</span></p>
            <small class="muted">O telefone não pode ser alterado depois do registo.</small>
          </div>

          <div id="feedbackPerfil" class="feedback" aria-live="polite"></div>
          <button class="btn btn-primary btn-block" type="submit">Guardar alterações</button>
          <a class="btn btn-secondary btn-block" href="./home.html">Cancelar</a>
        </form>

        <!-- A alteração de palavra-passe fica disponível apenas quando solicitada. -->
        <button id="btnMostrarAlterarSenha" class="btn btn-secondary btn-block" type="button" aria-expanded="false" aria-controls="secaoAlterarSenha">Alterar palavra-passe</button>

        <section id="secaoAlterarSenha" class="password-section hidden">
          <p class="eyebrow">Segurança</p>
          <h2>Nova palavra-passe</h2>
          <form id="alterarSenhaForm" novalidate>
            <label class="field">
              <span>Palavra-passe atual</span>
              <input id="senhaAtualInput" type="password" autocomplete="current-password" required />
            </label>
            <label class="field">
              <span>Nova palavra-passe</span>
              <input id="novaSenhaInput" type="password" autocomplete="new-password" minlength="6" required />
            </label>
            <label class="field">
              <span>Confirmar nova palavra-passe</span>
              <input id="confirmarNovaSenhaInput" type="password" autocomplete="new-password" minlength="6" required />
            </label>
            <div id="feedbackSenhaPerfil" class="feedback" aria-live="polite"></div>
            <button class="btn btn-primary btn-block" type="submit">Alterar palavra-passe</button>
          </form>
        </section>
      </section>
    </main>
    <script type="module" src="../js/home.js?v=1"></script>
  </body>
</html>
