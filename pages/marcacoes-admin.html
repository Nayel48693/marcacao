<!DOCTYPE html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Marcações — Admin</title>
    <link rel="icon" type="image/jpeg" href="../assets/icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" /></noscript>
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
    <main class="page-shell">
      <section class="form-card">
        <!-- Seta de regresso ao painel de administração -->
        <a href="./painel.html" class="back-arrow" aria-label="Voltar">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        </a>
        <div class="admin-header-center">
          <p class="eyebrow">Marcações</p>
          <h1>Gerir Marcações</h1>
        </div>
        <p>Lista completa de marcações, usa os filtros e altera estados conforme necessário.</p>

        <div class="field">
          <label>Filtrar por estado</label>
          <select id="filtroEstado">
            <option value="todas">Todas</option>
            <option value="pendente">Pendente</option>
            <option value="confirmada">Confirmada</option>
            <option value="concluida">Concluída</option>
            <option value="cancelada">Cancelada</option>
            <option value="adiada">Adiada</option>
          </select>
        </div>

        <div id="listaMarcacoesAdmin" class="table-list"></div>
      </section>
    </main>

    <script type="module" src="../js/marcacoes-admin.js"></script>
  </body>
</html>
